<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech News Daily</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f6f5f2; color: #1c1b19; }
  .app { display: flex; min-height: 100vh; align-items: flex-start; }
  .sidebar { width: 210px; flex-shrink: 0; padding: 20px 12px; position: sticky; top: 0; border-right: 1px solid #eae7e0; min-height: 100vh; }
  .brand { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; padding: 4px 10px 2px; }
  .brand-sub { font-size: 11.5px; color: #a19c91; padding: 0 10px 16px; }
  .navitem { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: #4a463f; cursor: pointer; margin-bottom: 2px; user-select: none; }
  .navitem:hover { background: #ececE6; }
  .navitem.active { background: #1c1b19; color: #fff; }
  .navitem .n { color: #a19c91; font-size: 12px; }
  .navitem.active .n { color: #cfcac0; }
  .nav-sep { height: 1px; background: #eae7e0; margin: 10px 6px; }
  .main { flex: 1; min-width: 0; padding: 20px 24px 60px; max-width: 780px; }
  .meta-row { display:flex; justify-content: space-between; align-items:center; margin-bottom: 16px; flex-wrap: wrap; gap:8px;}
  h1.pagetitle { font-size: 18px; margin: 0 0 2px; font-weight: 700; }
  .status { font-size: 12.5px; color: #8a857c; }
  .section-title { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: #8a857c; font-weight: 700; margin: 22px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title .flag { font-size: 14px; }
  .section-title .count { color: #b8b19f; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .card { background: #fff; border: 1px solid #eae7e0; border-radius: 10px; padding: 13px 15px; margin-bottom: 8px; }
  .card:hover { border-color: #cfc9bb; }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card-title-link { text-decoration: none; color: #1c1b19; flex: 1; min-width: 0; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .card-title-link:hover .card-title { text-decoration: underline; }
  .card-side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .card-time { font-size: 12px; color: #a19c91; white-space: nowrap; }
  .icon-btn { border: none; background: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 6px; color: #c9c4b8; }
  .icon-btn:hover { background: #f0eee8; }
  .icon-btn.saved { color: #c9861f; }
  .icon-btn.has-note { color: #3d7a4a; }
  .card-desc { font-size: 13px; color: #6b675f; line-height: 1.4; margin-top: 3px; }
  .card-tags { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; letter-spacing: .02em; }
  .tag.src { background: #eef0ec; color: #3d4a3a; }
  .tag.cat-VC-Deals { background: #fdeade; color: #9a4b12; }
  .tag.cat-VC { background: #f3e8fb; color: #6b2f9e; }
  .tag.cat-AI { background: #e3f0fd; color: #175a9e; }
  .tag.cat-Startup { background: #fdf1de; color: #93641a; }
  .tag.cat-Scale-up { background: #e1f5ea; color: #157a4a; }
  .tag.cat-Tech { background: #ececec; color: #4a4a4a; }
  .note-box { display: none; margin-top: 9px; }
  .note-box.open { display: block; }
  .note-box textarea { width: 100%; min-height: 54px; font-size: 13px; font-family: inherit; border: 1px solid #e3dfd3; border-radius: 8px; padding: 8px 10px; resize: vertical; background: #fffdf7; color: #4a463f; }
  .note-box textarea:focus { outline: none; border-color: #cfc39f; }
  .note-hint { font-size: 11px; color: #b8b19f; margin-top: 3px; }
  .empty { color: #a19c91; font-size: 13px; padding: 20px 4px; }
  .more-btn { display:block; margin: 10px auto 0; background:none; border:1px solid #d8d4cb; border-radius: 999px; padding: 7px 18px; font-size: 13px; color:#4a463f; cursor:pointer; }
  .more-btn:hover { border-color:#b8b19f; }
  .footer-note { margin-top: 30px; font-size: 11.5px; color: #b8b19f; text-align:center; }
  .learn-card { background: linear-gradient(135deg, #fbf3e3, #f6ecd8); border: 1px solid #e9dcb8; border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; position: relative; }
  .learn-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 800; color: #9a7d2e; margin-bottom: 6px; display:flex; align-items:center; gap:6px; }
  .learn-term { font-size: 17px; font-weight: 800; color: #3d2f0f; margin-bottom: 2px; }
  .learn-cat { display:inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: #fff; color: #9a7d2e; border: 1px solid #e9dcb8; border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
  .learn-def { font-size: 13.5px; color: #4a3f22; line-height: 1.5; margin-bottom: 10px; }
  .learn-why { font-size: 13px; color: #5c4d24; line-height: 1.5; background: rgba(255,255,255,.55); border-radius: 8px; padding: 9px 11px; }
  .learn-why b { color: #3d2f0f; }
  .learn-dismiss { position: absolute; top: 10px; right: 12px; border: none; background: none; cursor: pointer; font-size: 13px; color: #b3a061; }
  .learn-dismiss:hover { color: #7a6a3a; }
  .learn-card.collapsed .learn-def, .learn-card.collapsed .learn-why { display: none; }
  @media (max-width: 720px) { .app { flex-direction: column; } .sidebar { width: 100%; min-height: auto; position: static; border-right: none; border-bottom: 1px solid #eae7e0; } }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">Tech News Daily</div>
    <div class="brand-sub">Europe first &middot; US &amp; world second</div>
    <div id="nav"></div>
  </div>
  <div class="main">
    <div id="learnCard"></div>
    <div class="meta-row">
      <div>
        <h1 class="pagetitle" id="viewTitle">All</h1>
        <div class="status" id="status">Generated 2026-09-13 13:36 UTC</div>
      </div>
    </div>
    <div id="content"></div>
    <div class="footer-note">Sources: Sifted &middot; Tech.eu &middot; EU-Startups &middot; UKTN &middot; TechCrunch &middot; Crunchbase News. Refreshed once daily. Saved items and notes are stored locally and persist across daily refreshes.</div>
  </div>
</div>
<script>
(function () {
  const ITEMS = window.__DIGEST_ITEMS_FALLBACK__ || [];
</script>
<script src="data.js"></script>
<script>
(function () {
  const ITEMS = (window.DIGEST_ITEMS || []).map(i => Object.assign({}, i, { pubDate: new Date(i.pubDate) }));
  const TERM_OF_DAY = window.DIGEST_TERM || {};
  const NAV = [
    { key: "All", label: "All stories" },
    { key: "Saved", label: "★ Saved" },
    { key: "sep", label: "" },
    { key: "VC Deals", label: "VC Deals" },
    { key: "VC", label: "VC (Funds)" },
    { key: "AI", label: "AI" },
    { key: "Startup", label: "Startup" },
    { key: "Scale-up", label: "Scale-up" },
    { key: "Tech", label: "Tech" },
  ];
  let activeKey = "All";
  let euShown = 40, usShown = 20;
  const LS_SAVED = "digestSavedItems";
  const LS_NOTES = "digestNotes";
  function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; } }
  function saveJSON(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
  let savedItems = loadJSON(LS_SAVED);
  let notes = loadJSON(LS_NOTES);
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function countFor(key) { if (key === "All") return ITEMS.length; if (key === "Saved") return Object.keys(savedItems).length; return ITEMS.filter(i => i.cat === key).length; }
  function buildNav() {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";
    NAV.forEach(n => {
      if (n.key === "sep") { nav.appendChild(el("div", "nav-sep")); return; }
      const item = el("div", "navitem" + (n.key === activeKey ? " active" : ""));
      item.appendChild(el("span", "", n.label));
      item.appendChild(el("span", "n", String(countFor(n.key))));
      item.addEventListener("click", () => { activeKey = n.key; euShown = 40; usShown = 20; render(); });
      nav.appendChild(item);
    });
  }
  function timeAgo(date) { const diffMs = Date.now() - date.getTime(); const mins = Math.round(diffMs / 60000); if (mins < 1) return "just now"; if (mins < 60) return mins + "m ago"; const hrs = Math.round(mins / 60); if (hrs < 24) return hrs + "h ago"; const days = Math.round(hrs / 24); return days + "d ago"; }
  function itemSnapshot(item) { return { title: item.title, link: item.link, desc: item.desc, pubDate: item.pubDate.toISOString(), source: item.source, cat: item.cat, region: item.region }; }
  function cardFor(item) {
    const card = el("div", "card");
    const top = el("div", "card-top");
    const titleLink = el("a", "card-title-link");
    titleLink.href = item.link; titleLink.target = "_blank"; titleLink.rel = "noopener noreferrer";
    titleLink.appendChild(el("div", "card-title", item.title));
    top.appendChild(titleLink);
    const side = el("div", "card-side");
    side.appendChild(el("div", "card-time", timeAgo(item.pubDate)));
    const isSaved = !!savedItems[item.link];
    const saveBtn = el("button", "icon-btn" + (isSaved ? " saved" : ""), isSaved ? "★" : "☆");
    saveBtn.title = isSaved ? "Remove from saved" : "Save for later";
    saveBtn.addEventListener("click", () => { if (savedItems[item.link]) { delete savedItems[item.link]; } else { savedItems[item.link] = itemSnapshot(item); } saveJSON(LS_SAVED, savedItems); render(); });
    side.appendChild(saveBtn);
    const hasNote = !!(notes[item.link] && notes[item.link].trim());
    const noteBtn = el("button", "icon-btn" + (hasNote ? " has-note" : ""), "📝");
    noteBtn.title = "Add a note";
    side.appendChild(noteBtn);
    top.appendChild(side);
    card.appendChild(top);
    if (item.desc) card.appendChild(el("div", "card-desc", item.desc));
    const tags = el("div", "card-tags");
    tags.appendChild(el("span", "tag src", item.source));
    tags.appendChild(el("span", "tag cat-" + item.cat.replace(/\s/g, "-"), item.cat));
    card.appendChild(tags);
    const noteBox = el("div", "note-box" + (hasNote ? " open" : ""));
    const textarea = document.createElement("textarea");
    textarea.placeholder = "Your notes on this story…";
    textarea.value = notes[item.link] || "";
    let saveTimer = null;
    textarea.addEventListener("input", () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { const v = textarea.value; if (v.trim()) { notes[item.link] = v; noteBtn.classList.add("has-note"); } else { delete notes[item.link]; noteBtn.classList.remove("has-note"); } saveJSON(LS_NOTES, notes); buildNav(); }, 400); });
    noteBox.appendChild(textarea);
    noteBox.appendChild(el("div", "note-hint", "Saved automatically, just for you."));
    card.appendChild(noteBox);
    noteBtn.addEventListener("click", () => { noteBox.classList.toggle("open"); if (noteBox.classList.contains("open")) textarea.focus(); });
    return card;
  }
  function renderList(list, container) {
    const eu = list.filter(i => i.region === "eu").sort((a, b) => b.pubDate - a.pubDate);
    const us = list.filter(i => i.region === "us").sort((a, b) => b.pubDate - a.pubDate);
    container.appendChild(el("div", "section-title", '<span class="flag">🇪🇺</span> Europe <span class="count">(' + eu.length + ')</span>'));
    if (!eu.length) { container.appendChild(el("div", "empty", "Nothing here yet.")); }
    else { eu.slice(0, euShown).forEach(i => container.appendChild(cardFor(i))); if (eu.length > euShown) { const btn = el("button", "more-btn", "Show more Europe stories"); btn.addEventListener("click", () => { euShown += 40; render(); }); container.appendChild(btn); } }
    container.appendChild(el("div", "section-title", '<span class="flag">🌍</span> US &amp; Rest of World <span class="count">(' + us.length + ')</span>'));
    if (!us.length) { container.appendChild(el("div", "empty", "Nothing here yet.")); }
    else { us.slice(0, usShown).forEach(i => container.appendChild(cardFor(i))); if (us.length > usShown) { const btn = el("button", "more-btn", "Show more"); btn.addEventListener("click", () => { usShown += 40; render(); }); container.appendChild(btn); } }
  }
  function currentTitle() { const n = NAV.find(n => n.key === activeKey); return n ? n.label.replace("★ ", "") : "All"; }
  function render() {
    buildNav();
    document.getElementById("viewTitle").textContent = currentTitle();
    const content = document.getElementById("content");
    content.innerHTML = "";
    let list;
    if (activeKey === "All") { list = ITEMS; }
    else if (activeKey === "Saved") { const byLink = {}; Object.keys(savedItems).forEach(link => { byLink[link] = Object.assign({}, savedItems[link], { pubDate: new Date(savedItems[link].pubDate) }); }); ITEMS.forEach(i => { if (savedItems[i.link]) byLink[i.link] = i; }); list = Object.values(byLink); }
    else { list = ITEMS.filter(i => i.cat === activeKey); }
    if (!list.length) { content.appendChild(el("div", "empty", activeKey === "Saved" ? "Nothing saved yet — click the ☆ on any story to save it for later." : "No stories in this category right now.")); return; }
    renderList(list, content);
  }
  const LS_LEARN_DISMISSED = "digestLearnDismissedTerm";
  function renderLearnCard() {
    const holder = document.getElementById("learnCard");
    holder.innerHTML = "";
    if (!TERM_OF_DAY || !TERM_OF_DAY.term) return;
    const dismissedTerm = localStorage.getItem(LS_LEARN_DISMISSED);
    const collapsed = dismissedTerm === TERM_OF_DAY.term;
    const card = el("div", "learn-card" + (collapsed ? " collapsed" : ""));
    const dismissBtn = el("button", "learn-dismiss", collapsed ? "Show ▾" : "Hide ▴");
    dismissBtn.addEventListener("click", () => { const nowCollapsed = card.classList.toggle("collapsed"); if (nowCollapsed) localStorage.setItem(LS_LEARN_DISMISSED, TERM_OF_DAY.term); else localStorage.removeItem(LS_LEARN_DISMISSED); dismissBtn.textContent = nowCollapsed ? "Show ▾" : "Hide ▴"; });
    card.appendChild(el("div", "learn-kicker", "💡 Learn something today"));
    card.appendChild(el("div", "learn-term", TERM_OF_DAY.term));
    card.appendChild(el("div", "learn-cat", TERM_OF_DAY.cat || "Tech"));
    card.appendChild(el("div", "learn-def", TERM_OF_DAY.def));
    card.appendChild(el("div", "learn-why", "<b>Why it matters for tech &amp; VC:</b> " + TERM_OF_DAY.why));
    card.appendChild(dismissBtn);
    holder.appendChild(card);
  }
  renderLearnCard();
  buildNav();
  render();
})();
</script>
</body>
</html>
